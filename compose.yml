name: 0xviny

services:
  site:
    container_name: 0xviny-site
    build:
      context: .
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.vinicius-site.rule=Host(`0xviny.com.br`)"
      - "traefik.http.routers.vinicius-site.entrypoints=websecure"
      - "traefik.http.routers.vinicius-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vinicius-site.service=vinicius-site"

      - "traefik.http.routers.vinicius-site-www.rule=Host(`www.0xviny.com.br`)"
      - "traefik.http.routers.vinicius-site-www.entrypoints=websecure"
      - "traefik.http.routers.vinicius-site-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vinicius-site-www.middlewares=www-redirect"
      - "traefik.http.routers.vinicius-site-www.service=vinicius-site"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.*)$$"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$$1"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"

      - "traefik.http.services.vinicius-site.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
