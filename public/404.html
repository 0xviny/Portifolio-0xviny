<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#050706" />
    <title>Página não encontrada — Vinicius Gabriel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #050706;
        color: #d8dbd9;
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        margin: 0 0 18px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #34c88b;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.25rem, 9vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 28px;
        max-width: 34ch;
        line-height: 1.6;
        color: #8b938e;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 26px;
        border: 1px solid #17a06d;
        background: rgba(13, 122, 84, 0.4);
        color: #d8dbd9;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-decoration: none;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      a:hover {
        background: #0d7a54;
        color: #fff;
      }
      a:focus-visible {
        outline: 2px solid #34c88b;
        outline-offset: 3px;
      }
    </style>

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TPV2L7CV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TPV2L7CV"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main>
      <p class="code">Erro 404</p>
      <h1>Página não encontrada</h1>
      <p>Este endereço não existe — o link pode estar antigo ou digitado errado.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
